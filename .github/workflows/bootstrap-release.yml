name: bootstrap release
on:
  push:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Expand exact v1.0.0 release tree
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/release.b64 <<'EOF'

EOF
          base64 --decode /tmp/release.b64 > /tmp/release.tgz
          tar -xzf /tmp/release.tgz -C "$GITHUB_WORKSPACE"
          rm -f .github/workflows/bootstrap-release.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish v1.0.0"
          git push origin HEAD:${GITHUB_REF_NAME}
