[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vec-splitforge"
version = "1.0.0"
description = "Leakage-audited pseudo-holdout construction for Virtual Embryo Challenge local evaluation."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []
keywords = ["virtual-embryo", "cross-validation", "pseudo-validation", "data-leakage"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
vec-splitforge = "vec_splitforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
